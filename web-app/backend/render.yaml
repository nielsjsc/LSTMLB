services:
  - type: web
    name: longball-api
    runtime: python
    buildCommand: cd web-app/backend && pip install -r requirements.txt && pip install -e .
    startCommand: cd web-app/backend && PYTHONPATH=/opt/render/project/src/web-app/backend uvicorn wsgi:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: /opt/render/project/src/web-app/backend
      - key: DATABASE_URL
        sync: false
      - key: ENVIRONMENT
        value: production