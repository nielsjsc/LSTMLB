services:
  - type: web
    name: longball-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: PYTHONPATH=/opt/render/project/src/web-app/backend uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: /opt/render/project/src/web-app/backend
      - key: DATABASE_URL
        sync: false
      - key: ENVIRONMENT
        value: production